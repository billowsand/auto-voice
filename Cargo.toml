[package]
name = "auto-voice"
version = "0.1.0"
edition = "2021"
authors = ["billowsand"]
description = "Windows 本地语音转文字工具，支持 PTT、音频文件转录、说话人分离和 LLM 文本纠错"
license = "MIT"
readme = "README.md"
repository = "https://github.com/billowsand/auto-voice"
homepage = "https://github.com/billowsand/auto-voice"
keywords = ["speech-to-text", "asr", "windows", "sensevoice", "sherpa-onnx"]
categories = ["command-line-utilities", "multimedia::audio"]
rust-version = "1.92"
publish = false
exclude = [
    ".claude/",
    ".github/",
    ".codex",
    "docs/assets/social-preview.png",
    "tools/",
]

[[bin]]
name = "auto-voice"
path = "src/main.rs"

[dependencies]
clap        = { version = "4", features = ["derive"] }
tokio       = { version = "1", features = ["full"] }
anyhow      = "1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "0.8"
directories = "6"
skrifa = "0.42.1"

# 跨平台桌面 UI。Glow 比默认 WGPU 依赖更轻，适合常驻托盘应用。
eframe = { version = "0.35", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }

# 音频解码 (MP3/WAV/FLAC/OGG/M4A/MKV/AIFF/…)
symphonia = { version = "0.5", features = [
    "mp3",    # MP3, MP2, MP1
    "aac",    # AAC (裸流)
    "flac",   # FLAC
    "ogg",    # OGG Vorbis / OGG Opus / OGG FLAC
    "wav",    # WAV / WAVE (PCM, IEEE Float)
    "isomp4", # MP4 / M4A / M4B / AAC-in-MP4 / ALAC
    "adpcm",  # ADPCM (微软 WAV 扩展)
    "mkv",    # Matroska / WebM / MKA
    "aiff",   # AIFF / AIFF-C
] }

# 重采样
rubato = "0.15"

# 麦克风采集 (Windows: WASAPI)
cpal = "0.18"

# HTTP 客户端 (LMStudio API)
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }

# 剪切板
arboard = "3"

# Ctrl+C 处理
ctrlc = "3"

# 日期时间
chrono = { version = "0.4", features = ["clock"] }

# CapsLock PTT: 全局键盘钩子 + Ctrl+V 模拟
rdev  = "0.5"
enigo = "0.2"

# 系统托盘
tray-icon = "0.17"

# Windows 消息泵（托盘需要）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_Controls",
] }

# sherpa-onnx 官方 Rust crate，shared = 使用预编译 DLL
sherpa-onnx = { version = "1", default-features = false }

[build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = 3        # 最高速度优化
lto = "thin"         # 比 true (fat LTO) 快很多，体积接近
codegen-units = 1    # 允许跨 crate 优化
strip = true         # 剥离调试符号（Windows 上减少 30-50%）
panic = "abort"      # 去掉 unwinding 代码（减少约 10%）
